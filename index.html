<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书文案助手 - 陶艺馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #FFF8F0 0%, #FDF3E7 50%, #F9EDE0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* 顶部标题 */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 22px;
            color: #8B5E3C;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            color: #B8977E;
            margin-top: 4px;
        }

        /* 文案卡片 */
        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 4px 20px rgba(139, 94, 60, 0.08);
            margin-bottom: 16px;
        }

        .card .label {
            display: inline-block;
            background: #FDF3E7;
            color: #C8966C;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .card .content {
            font-size: 15px;
            line-height: 1.8;
            color: #5D4037;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .card .hashtags {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed #F0E0D0;
        }

        .card .hashtags span {
            display: inline-block;
            color: #C8966C;
            font-size: 13px;
            margin-right: 8px;
            margin-bottom: 4px;
            font-weight: 500;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-copy {
            background: #8B5E3C;
            color: #FFFFFF;
        }

        .btn-copy:active {
            background: #6D4A2E;
        }

        .btn-refresh {
            background: #FFFFFF;
            color: #8B5E3C;
            border: 2px solid #E8D5C0;
        }

        .btn-refresh:active {
            background: #FDF3E7;
        }

        .btn-xhs {
            width: 100%;
            background: linear-gradient(135deg, #FF5A5F, #FF2442);
            color: #FFFFFF;
            padding: 16px;
            font-size: 16px;
            border-radius: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-xhs:active {
            transform: scale(0.97);
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(93, 64, 55, 0.9);
            color: #FFFFFF;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: all 0.25s ease;
            z-index: 999;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 底部 */
        .footer {
            text-align: center;
            color: #C4A88B;
            font-size: 12px;
            margin-top: 20px;
        }

        /* 选择风格 */
        .style-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .style-tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 2px solid #E8D5C0;
            background: #FFFFFF;
            color: #8B5E3C;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .style-tag:active {
            transform: scale(0.95);
        }

        .style-tag.active {
            background: #8B5E3C;
            color: #FFFFFF;
            border-color: #8B5E3C;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <span class="icon">🏺</span>
            <h1>陶艺馆 · 小红书文案助手</h1>
            <p>选风格 → 复制文案 → 去小红书发布</p>
        </div>

        <!-- 风格选择 -->
        <div class="style-selector" id="styleSelector">
            <span class="style-tag active" data-style="文艺">🎨 文艺清新</span>
            <span class="style-tag" data-style="探店">🧭 探店打卡</span>
            <span class="style-tag" data-style="教程">📖 体验教程</span>
            <span class="style-tag" data-style="情侣">💑 情侣约会</span>
            <span class="style-tag" data-style="亲子">👨‍👩‍👧 亲子时光</span>
            <span class="style-tag" data-style="解压">😌 解压治愈</span>
        </div>

        <!-- 文案卡片 -->
        <div class="card">
            <div class="label" id="styleLabel">🎨 文艺清新</div>
            <div class="content" id="content"></div>
            <div class="hashtags" id="hashtags"></div>
        </div>

        <!-- 按钮 -->
        <div class="btn-group">
            <button class="btn btn-copy" onclick="copyText()">
                📋 一键复制
            </button>
            <button class="btn btn-refresh" onclick="refreshContent()">
                🔄 换一条
            </button>
        </div>

        <a class="btn-xhs" href="xhsdiscover://" id="xhsBtn">
            📕 打开小红书去发布
        </a>

        <!-- 底部 -->
        <div class="footer">
            扫码即用 · 文案随机生成 · 每日更新灵感 ✨
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============ 文案库 ============
        const copyPool = {
            文艺: [
                {
                    text: "安静地坐在陶轮前\n感受泥土在指尖慢慢成形\n\n时间仿佛也变得温柔\n每一圈旋转都是和内心的对话\n\n在这个快节奏的城市里\n给自己一个慢下来的午后吧 🍂",
                    tags: "#陶艺体验 #慢生活 #手工制作 #治愈时光 #周末去哪儿 #文艺生活"
                },
                {
                    text: "泥土的芬芳\n指尖的温度\n旋转的陶轮像时光机\n\n把一团普通的泥\n慢慢变成独一无二的作品\n\n这大概就是手作的浪漫吧 🌿",
                    tags: "#手作温度 #陶艺生活 #治愈系 #慢时光 #文艺小店 #手工陶艺"
                },
                {
                    text: "窗外阳光正好\n手里捧着一团湿润的泥土\n\n捏、揉、拉、塑\n每一个动作都让人专注又放松\n\n原来快乐可以这么简单\n就是亲手做一件属于自己的器皿 🪷",
                    tags: "#简单快乐 #陶艺时光 #手作日常 #周末慢生活 #治愈手作 #器物之美"
                },
                {
                    text: "在陶轮前坐了一下午\n手机都没碰过\n\n世界安静得只剩下\n泥土和手掌摩擦的声音\n\n这种沉浸的感觉\n好久没有过了 ✨",
                    tags: "#沉浸式体验 #陶艺 #放下手机 #手作治愈 #慢节奏生活 #周末好去处"
                },
            ],
            探店: [
                {
                    text: "发现一家藏在巷子里的陶艺馆！\n\n门头不大，但里面别有洞天\n满墙的手作器物，每一件都不一样\n\n老师超有耐心，手把手教\n零基础也能做出像样的杯子 🏺\n\n姐妹们冲冲冲！",
                    tags: "#宝藏店铺 #陶艺探店 #周末打卡 #小众体验 #手作工坊 #城市探索"
                },
                {
                    text: "挖到宝了！！这家陶艺馆也太好拍了吧 📸\n\n原木风装修，每个角落都出片\n老板收藏的老器物摆了一整面墙\n\n体验套餐还包含烧制和上釉\n人均不到200就能拥有自己的手作杯\n\n已经约了闺蜜下周再来！",
                    tags: "#出片圣地 #陶艺馆探店 #宝藏小店 #周末打卡 #闺蜜约会 #手作体验"
                },
                {
                    text: "跟风来打卡这家网红陶艺馆\n结果…真的被圈粉了！\n\n环境：⭐⭐⭐⭐⭐\n教学：⭐⭐⭐⭐⭐\n出片：⭐⭐⭐⭐⭐\n\n做出来的杯子太有成就感了\n已经在期待两周后烧好寄给我的样子 😍",
                    tags: "#网红打卡 #陶艺体验 #真实测评 #手工制作 #周末生活 #好店推荐"
                },
            ],
            教程: [
                {
                    text: "陶艺新手必看！5步做出你的第一个杯子 🎯\n\n1️⃣ 揉泥：把气泡揉出来，大概5分钟\n2️⃣ 定中心：关键一步！手掌用力稳住\n3️⃣ 开孔：拇指垂直向下，别歪\n4️⃣ 拉高：双手配合，慢慢往上提\n5️⃣ 塑形：做出你想要的弧度\n\n第一次做不用追求完美\n歪歪扭扭的才独一无二 💪",
                    tags: "#陶艺教程 #手工入门 #零基础陶艺 #新手教学 #手作分享 #体验课"
                },
                {
                    text: "拉胚翻车了怎么办？别慌！🙌\n\n分享几个新手常见问题：\n\n▫️泥巴转飞了 → 水太多，少加点\n▫️中间歪了 → 定中心时没用力\n▫️杯壁厚薄不均 → 手要稳，匀速提\n▫️边缘裂了 → 手太干，多沾水\n\n记住：每个大师都从失败开始\n享受过程最重要～",
                    tags: "#陶艺技巧 #拉胚教学 #手作避坑 #陶艺入门 #手工教程 #体验分享"
                },
            ],
            情侣: [
                {
                    text: "和Ta一起做陶艺\n大概是最浪漫的约会之一了吧 💕\n\n你捏杯身，Ta做杯把\n两个人手上都是泥，相视一笑\n\n烧出来也许不完美\n但那是属于你们的、独一无二的东西\n\n偷偷说：做陶艺的时候他认真的样子真的很帅 🤫",
                    tags: "#情侣约会 #陶艺体验 #恋爱日常 #周末约会 #手工DIY #甜蜜时光"
                },
                {
                    text: "约会不知道去哪？来捏泥巴呀！🥰\n\n比看电影有意思多了\n两个人一起学一起笑\n互相在对方作品上刻字\n\n我们的约定：\n以后家里用的杯子都要是自己做的 🥂",
                    tags: "#情侣好去处 #约会推荐 #陶艺手作 #浪漫约会 #两人世界 #手作情侣杯"
                },
            ],
            亲子: [
                {
                    text: "带娃体验陶艺，比想象中好玩一百倍！👧👦\n\n小朋友的想象力真的太丰富了\n捏出来的东西虽然…抽象\n但每一个都有故事\n\n老师说捏泥巴可以锻炼专注力和手部精细动作\n还能远离手机，一举多得！\n\n推荐3岁以上宝贝来玩～",
                    tags: "#亲子活动 #遛娃好去处 #陶艺体验 #儿童手工 #周末遛娃 #亲子时光"
                },
                {
                    text: "下雨天遛娃新选择！陶艺馆半日游 🌧️\n\n全程2小时，娃从头玩到尾\n完全没喊无聊也没要看手机\n（老母亲感动哭了）\n\n最后一人做了一个碗\n宝贝说以后要用自己做的碗吃饭\n饭量都变大了哈哈哈 🍚",
                    tags: "#亲子手工 #遛娃推荐 #雨天去哪玩 #陶艺课 #带娃日常 #高质量陪伴"
                },
            ],
            解压: [
                {
                    text: "最近压力大到爆炸\n朋友拉我来做陶艺\n\n手碰到湿润泥土的那一刻\n整个人突然就松下来了\n\n专注捏泥的两小时里\n脑子里那些乱七八糟的事都消失了\n\n原来这就是传说中的「心流」状态吧 🧘",
                    tags: "#解压方式 #陶艺疗愈 #治愈手工 #压力释放 #心流体验 #自我疗愈"
                },
                {
                    text: "比捏泡泡纸还解压的事情找到了！\n\n就是——捏！泥！巴！\n\n看着泥团在手中变软变顺\n然后在陶轮上转出一个圆润的形状\n这个过程太治愈了\n\n什么KPI、OKR统统抛在脑后\n此刻只有我和我的泥巴 🌈",
                    tags: "#解压神器 #陶艺体验 #治愈系 #打工人解压 #周末放松 #手工治愈"
                },
            ],
        };

        let currentStyle = '文艺';
        let currentText = '';
        let currentTags = '';

        // ============ 随机获取文案 ============
        function getRandomCopy(style) {
            const pool = copyPool[style];
            const item = pool[Math.floor(Math.random() * pool.length)];
            return { text: item.text, tags: item.hashtags };
        }

        // ============ 更新页面 ============
        function updateContent() {
            const { text, tags } = getRandomCopy(currentStyle);
            currentText = text;
            currentTags = tags;

            document.getElementById('content').textContent = text;

            const tagsArr = tags.split(' ');
            const hashtagsDiv = document.getElementById('hashtags');
            hashtagsDiv.innerHTML = tagsArr.map(t => `<span>${t}</span>`).join('');

            document.getElementById('styleLabel').textContent =
                document.querySelector(`[data-style="${currentStyle}"]`).textContent;
        }

        // ============ 复制文案 ============
        function copyText() {
            const fullText = currentText + '\n\n' + currentTags;
            navigator.clipboard.writeText(fullText).then(() => {
                showToast('✅ 文案已复制，去小红书粘贴吧！');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = fullText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ 文案已复制，去小红书粘贴吧！');
            });
        }

        // ============ 刷新文案 ============
        function refreshContent() {
            const card = document.querySelector('.card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(10px)';
            card.style.transition = 'all 0.2s ease';

            setTimeout(() => {
                updateContent();
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
                showToast('🔄 已换一条新文案～');
            }, 200);
        }

        // ============ Toast ============
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        // ============ 风格切换 ============
        document.getElementById('styleSelector').addEventListener('click', (e) => {
            const tag = e.target.closest('.style-tag');
            if (!tag) return;

            document.querySelectorAll('.style-tag').forEach(t => t.classList.remove('active'));
            tag.classList.add('active');

            currentStyle = tag.dataset.style;
            updateContent();
            showToast(`已切换至「${tag.textContent.trim()}」`);
        });

        // ============ 小红书跳转 ============
        document.getElementById('xhsBtn').addEventListener('click', function(e) {
            const start = Date.now();
            window.location.href = 'xhsdiscover://';

            setTimeout(() => {
                if (Date.now() - start < 2000) {
                    window.location.href = 'https://apps.apple.com/cn/app/id741292507';
                }
            }, 1500);
        });

        // ============ 初始化 ============
        updateContent();
    </script>

</body>
</html>

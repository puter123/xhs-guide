function randomPick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function fillTemplate(tpl) {
    return tpl
        .replace(/\{emotions\}/g, function() { return randomPick(emotions); })

        .replace(/\{feelWords\}/g, function() { return randomPick(feelWords); })

        .replace(/\{soloPerson\}/g, function() { return randomPick(soloPerson); })

// ==========================================
//  防重复 + 降权机制
//  用 localStorage 记录每条被复制的次数
// ==========================================
var STORAGE_KEY = "xhs_copy_history_v2";

function getHistory() {
    try {
        var raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
    } catch(e) {
        return {};
    }
}

function saveHistory(history) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch(e) {}
}

// 记录某条文案被复制
function recordCopy(text) {
    var history = getHistory();
    // 用文本前100字符做key
    var key = text.substring(0, 100).replace(/\s/g, "");
    history[key] = (history[key] || 0) + 1;
    saveHistory(history);
}

// 获取某条文案被复制次数
function getCopyCount(text) {
    var history = getHistory();
    var key = text.substring(0, 100).replace(/\s/g, "");
    return history[key] || 0;
}

// ==========================================
//  核心：带权重的随机选择
//  复制过的降低权重
// ==========================================
var MAX_RETRY = 50; // 最多尝试50次找未复制的

function generateCopy() {
    var templates = templatesMap[currentStyle] || templates_文艺;
    var baseTags = baseTagsMap[currentStyle] || baseTagsMap["文艺"];

    // 尝试找一条没被复制过的
    var bestText = "";
    var bestCount = Infinity;

    for (var attempt = 0; attempt < MAX_RETRY; attempt++) {
        var tpl = randomPick(templates);
        var text = fillTemplate(tpl);
        var count = getCopyCount(text);

        if (count === 0) {
            // 没被复制过，直接用
            return { text: text, tags: baseTags + SHOP_TAG };
        }

        if (count < bestCount) {
            bestCount = count;
            bestText = text;
        }
    }

    // 所有尝试的都被复制过，返回复制次数最少的
    return { text: bestText, tags: baseTags + SHOP_TAG };
}

// ==========================================
//  当前状态
// ==========================================
var currentStyle = "文艺";
var currentText = "";
var currentTags = "";

function updateContent() {
    var copy = generateCopy();
    currentText = copy.text;
    currentTags = copy.tags;

    var contentEl = document.getElementById("content");
    var hashtagsEl = document.getElementById("hashtags");
    var labelEl = document.getElementById("styleLabel");

    if (contentEl) contentEl.textContent = currentText;

    if (hashtagsEl && currentTags) {
        var tagsArr = currentTags.split(" ").filter(function(t) { return t.trim().length > 0; });
        hashtagsEl.innerHTML = tagsArr.map(function(t) { return "<span>" + t + "</span>"; }).join("");
    }

    var activeTag = document.querySelector(".style-tag.active");
    if (labelEl && activeTag) {
        labelEl.textContent = activeTag.textContent.trim();
    }
}

// 一键复制（记录降权）
function copyText() {
    recordCopy(currentText);
    var fullText = currentText + "\n\n" + currentTags;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullText).then(function() {
            showToast("✅ 文案已复制，去小红书粘贴吧！");
        }).catch(function() {
            fallbackCopy(fullText);
        });
    } else {
        fallbackCopy(fullText);
    }
}

function fallbackCopy(text) {
    var textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.appendChild(textarea);
    textarea.select();
    try { document.execCommand("copy"); } catch(e) {}
    document.body.removeChild(textarea);
    showToast("✅ 文案已复制，去小红书粘贴吧！");
}

// 换一条
function refreshContent() {
    var card = document.getElementById("card");
    if (card) {
        card.style.opacity = "0";
        card.style.transform = "translateY(10px)";
    }

    setTimeout(function() {
        updateContent();
        if (card) {
            card.style.opacity = "1";
            card.style.transform = "translateY(0)";
        }
        showToast("🔄 已换一条新文案～");
    }, 200);
}

// Toast
var toastTimer;
function showToast显示Toast(msg消息) {
    var toast = document.getElementById("toast");
    if (!toast) return;    如果 (!toast) 返回;
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
        toast.classList.remove("show");
    }, 1800);
}

// 打开小红书
function openXHS() {
    var start = Date.now();
    window.location.href = "xhsdiscover://";
    setTimeout(function() {
        if (Date.now() - start < 2000) {        如果 (日期.现在() - 开始 < 2000) {
            window.location.href = "https://apps.apple.com/cn/app/id741292507";
        }
    }, 1500);
}

// 风格切换
document.getElementById("styleSelector").addEventListener("click", function(e) {
    var tag = e.target.closest(".style-tag");
    if (!tag) return;

    var allTags = document.querySelectorAll(".style-tag");
    allTags.forEach(function(t) { t.classList.remove("active"); });
    tag.classList.add("active");    标签.classList.添加("active");

    currentStyle = tag.getAttribute("data-style");    当前样式 = 标签.获取属性("data-style");
    updateContent();
    showToast("已切换至「" + tag.textContent.trim() + "」");
});

// 初始化
updateContent();
